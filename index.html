<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WISERVET — ¿Cuánto conoces realmente tu clínica?</title>
<!-- APP INSTALABLE (PWA) -->
<meta name="theme-color" content="#198fe9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WISERVET">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#f3f9fe;
    --card:#ffffff;
    --ink:#163358;
    --muted:#66788f;
    --accent:#198fe9;
    --accent2:#54b8ff;
    --cyan:#dff4ff;
    --yellow:#ffd866;
    --mint:#c9f3e4;
    --pink:#ffd7e7;
    --line:#dce8f2;
    --yes:#20a66a;
    --no:#e95b5b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 15% 15%,#ffffff 0 18%,transparent 38%),radial-gradient(circle at 85% 80%,#dff4ff 0 12%,transparent 34%),var(--bg);font-family:Inter,Arial,sans-serif;color:var(--ink);min-height:100vh}
  .app{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .shell{width:min(1080px,100%);min-height:720px;background:var(--card);border:1px solid #d7e6f1;border-radius:32px;box-shadow:0 24px 70px rgba(22,51,88,.15);overflow:hidden;position:relative}
  header{height:82px;padding:15px 28px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:relative;background:rgba(255,255,255,.96);z-index:30}
  .brand{font-weight:950;letter-spacing:.08em;font-size:18px;color:var(--ink)}
  .tag{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-right:155px}
  .logo{position:absolute;right:22px;top:10px;width:140px;height:56px;object-fit:contain;object-position:right center}
  main{padding:38px 54px;display:flex;align-items:center;justify-content:center;min-height:638px;position:relative}
  .screen{width:min(800px,100%);text-align:center;position:relative;z-index:4}
  h1{font-size:clamp(38px,5.4vw,64px);line-height:.98;margin:0 0 18px;font-weight:950;letter-spacing:-.04em}
  h2{font-size:clamp(30px,4vw,44px);line-height:1.02;margin:0 0 14px;font-weight:950;letter-spacing:-.03em}
  p{font-size:18px;line-height:1.5;color:var(--muted)}
  .sub{max-width:700px;margin:0 auto 28px}
  button{border:0;border-radius:16px;padding:16px 25px;font-size:16px;font-weight:900;cursor:pointer;transition:.18s;min-height:56px}
  button:hover{transform:translateY(-2px)}
  .primary{background:var(--accent);color:white;box-shadow:0 10px 24px rgba(25,143,233,.28)}
  .primary:hover{box-shadow:0 14px 28px rgba(25,143,233,.34)}
  .secondary{background:#edf5fa;color:var(--ink)}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .form{display:grid;gap:14px;max-width:520px;margin:25px auto}
  input{width:100%;padding:17px;border:2px solid #e2edf5;border-radius:14px;font-size:16px;outline:none;background:#fbfdff}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(25,143,233,.09)}

  /* VET PARTY DECOR */
  .vet-decor{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:1}
  .sticker{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:32px;filter:drop-shadow(0 12px 12px rgba(22,51,88,.14));user-select:none}
  .sticker span{display:block;transform:rotate(-7deg)}
  .sticker-paw{left:-26px;top:64px;width:130px;height:130px;background:var(--yellow);font-size:74px;transform:rotate(-15deg);animation:floaty 4s ease-in-out infinite}
  .sticker-dog{right:-26px;top:78px;width:150px;height:150px;background:var(--pink);font-size:86px;transform:rotate(9deg);animation:floaty 4.7s ease-in-out infinite .4s}
  .sticker-cat{left:-32px;bottom:55px;width:145px;height:145px;background:var(--mint);font-size:82px;transform:rotate(10deg);animation:floaty 4.3s ease-in-out infinite .8s}
  .sticker-vet{right:-28px;bottom:58px;width:132px;height:132px;background:var(--cyan);font-size:72px;transform:rotate(-10deg);animation:floaty 5s ease-in-out infinite .2s}
  .bubble{position:absolute;border-radius:50%;background:#eaf7ff;opacity:.9}
  .bubble.b1{width:90px;height:90px;left:17%;top:8%}.bubble.b2{width:54px;height:54px;right:16%;bottom:12%}.bubble.b3{width:28px;height:28px;right:28%;top:15%;background:#fff0a9}
  @keyframes floaty{0%,100%{translate:0 0}50%{translate:0 -8px}}

  .hero-badge{display:inline-flex;align-items:center;gap:8px;background:#e7f5ff;color:#127bc9;border:1px solid #c9e9fb;border-radius:999px;padding:9px 15px;font-size:12px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
  .hero-visual{height:155px;position:relative;max-width:680px;margin:0 auto 18px}
  .hero-pet{position:absolute;font-size:100px;filter:drop-shadow(0 10px 8px rgba(22,51,88,.14));animation:floaty 4s ease-in-out infinite}
  .hero-pet.p1{left:8%;transform:rotate(-10deg)}.hero-pet.p2{right:9%;transform:rotate(9deg);animation-delay:.5s}.hero-pet.p3{left:50%;transform:translateX(-50%);font-size:78px;top:38px;animation-delay:.9s}
  .spark{position:absolute;font-size:28px;font-weight:900}.spark.s1{left:29%;top:15px;color:#198fe9}.spark.s2{right:31%;top:34px;color:#f2b900}.spark.s3{left:39%;bottom:5px;color:#20a66a}

  /* ROULETTE */
  .wheel-area{position:relative;width:560px;height:490px;margin:12px auto 4px;max-width:100%}
  .wheel-wrap{width:440px;height:440px;position:absolute;left:50%;top:0;transform:translateX(-50%)}
  .wheel{width:100%;height:100%;border-radius:50%;border:8px solid #fff;box-shadow:0 18px 45px rgba(22,51,88,.2),0 0 0 5px #bfe6fb;position:relative;overflow:hidden;transition:transform 5.5s cubic-bezier(.12,.75,.18,1);background:#198fe9}
  .wheel-svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .wheel-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:116px;height:116px;border-radius:50%;background:#fff;border:7px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:17px;font-weight:950;z-index:12;box-shadow:0 8px 20px rgba(22,51,88,.2);cursor:pointer;user-select:none;transition:.18s}
  .wheel-center .paw{font-size:35px;line-height:1;margin-bottom:3px}
  .pointer{position:absolute;top:-1px;left:50%;transform:translateX(-50%);width:42px;height:42px;background:var(--ink);clip-path:polygon(0 0,100% 0,50% 100%);z-index:8;filter:drop-shadow(0 5px 4px rgba(0,0,0,.15))}
  .wheel-center:hover{transform:translate(-50%,-50%) scale(1.04)}
  .wheel-center:active{transform:translate(-50%,-50%) scale(.97)}
  .corner-logo{position:absolute;left:22px;bottom:14px;width:145px;height:auto;object-fit:contain;z-index:28;display:block;mix-blend-mode:normal;background:transparent}
  .wheel-pet{position:absolute;z-index:10;font-size:58px;filter:drop-shadow(0 7px 7px rgba(22,51,88,.16))}
  .wp1{left:2px;top:32px;transform:rotate(-14deg)}.wp2{right:0;top:38px;transform:rotate(12deg)}.wp3{left:6px;bottom:18px;transform:rotate(8deg)}.wp4{right:4px;bottom:18px;transform:rotate(-8deg)}
  .wheel-caption{font-weight:900;color:var(--ink);font-size:15px;margin:2px auto 16px}

  /* CATEGORY */
  .category-card{width:220px;height:220px;margin:4px auto 20px;border-radius:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 16px 35px rgba(22,51,88,.16);border:7px solid #fff;position:relative;overflow:hidden}
  .category-card:after{content:"";position:absolute;width:170px;height:170px;border:2px dashed rgba(255,255,255,.75);border-radius:50%}
  .category-icon{font-size:94px;line-height:1;z-index:2;filter:drop-shadow(0 7px 4px rgba(22,51,88,.14))}
  .category-mini{font-size:12px;font-weight:950;letter-spacing:.1em;color:rgba(22,51,88,.65);z-index:2;margin-top:9px}
  .cat-clinica{background:var(--cyan)}.cat-fin{background:#fff0b6}.cat-clientes{background:var(--mint)}

  /* QUESTIONS */
  .progress{height:10px;background:#e9f0f5;border-radius:99px;overflow:hidden;margin:0 auto 24px;max-width:720px}.bar{height:100%;background:linear-gradient(90deg,#198fe9,#58c0ff);transition:.25s}
  .qtop{display:flex;align-items:center;justify-content:center;gap:15px;margin-bottom:9px}.qnum{font-size:13px;font-weight:950;color:var(--muted);letter-spacing:.08em}
  .timer{font-size:30px;font-weight:950;width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:6px solid var(--accent);background:#eef8ff;box-shadow:0 8px 20px rgba(25,143,233,.14)}
  .question{font-size:31px;line-height:1.16;font-weight:900;margin:12px auto 24px;max-width:720px;letter-spacing:-.02em}
  .answer-row{display:flex;gap:18px;justify-content:center}.yes,.no{color:#fff;min-width:170px;font-size:18px}.yes{background:var(--yes);box-shadow:0 9px 20px rgba(32,166,106,.22)}.no{background:var(--no);box-shadow:0 9px 20px rgba(233,91,91,.22)}
  .note{margin:19px auto 0;text-align:left;max-width:610px}.note textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:14px;padding:12px;font:inherit;resize:vertical;background:#fbfdff}.small{font-size:13px;color:var(--muted)}

  .result-number{font-size:100px;font-weight:950;line-height:1;color:var(--accent);text-shadow:0 8px 0 #dff4ff;margin:18px 0 10px}
  .result-logo{width:170px;height:auto;object-fit:contain;margin:4px auto 10px;display:block}
  .meeting-logo{width:150px;height:auto;object-fit:contain;margin:0 auto 16px;display:block}.result-title{font-size:30px;font-weight:950;margin-bottom:10px}.result-copy{max-width:650px;margin:0 auto 28px}
  .result-fun{display:inline-flex;align-items:center;gap:8px;background:#fff5bd;border:2px solid #ffe07a;border-radius:999px;padding:10px 18px;font-weight:950;margin:4px auto 14px;box-shadow:0 8px 18px rgba(255,216,102,.22)}
  .whatsapp-result{background:#20a66a;color:#fff;box-shadow:0 10px 24px rgba(32,166,106,.25)}
  .meeting{background:#eef8ff;border:2px solid #cfeaf9;border-radius:26px;padding:34px;margin-top:24px;box-shadow:0 14px 35px rgba(22,51,88,.08)}
  .admin{position:absolute;right:18px;bottom:10px;font-size:10px;color:#9ba9b7}.hidden{display:none!important}
  .side-nav{position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;pointer-events:none;z-index:25}.navbtn{pointer-events:auto;width:44px;height:44px;min-height:44px;padding:0;border-radius:50%;background:#fff;border:1px solid var(--line);box-shadow:0 6px 18px rgba(22,51,88,.10);font-size:26px;color:var(--ink)}.navbtn:disabled{opacity:.2}
  .answer-summary{margin:20px auto;text-align:left;max-width:740px;border:1px solid var(--line);border-radius:18px;padding:16px;background:#fbfdff}.answer-row-summary{display:grid;grid-template-columns:42px 1fr 70px;gap:10px;padding:10px 0;border-bottom:1px solid #e8eef3;font-size:14px}.answer-row-summary:last-child{border-bottom:0}.answer-yes{color:var(--yes);font-weight:950}.answer-no{color:var(--no);font-weight:950}
  .choco{font-size:78px;margin-bottom:8px;filter:drop-shadow(0 10px 5px rgba(22,51,88,.12))}.saved{font-weight:800;color:var(--yes);margin-top:12px}
  table th,table td{padding:10px;border-bottom:1px solid #e7eef4} table th{background:#f1f8fc}
  @media(max-width:760px){main{padding:28px 22px}.shell{min-height:650px}.tag{display:none}.logo{right:18px;width:128px}.corner-logo{left:14px;bottom:10px;width:112px}.brand{font-size:15px}.sticker{opacity:.75;scale:.75}.sticker-paw{left:-50px}.sticker-dog{right:-50px}.sticker-cat{left:-50px}.sticker-vet{right:-50px}.hero-visual{height:125px}.hero-pet{font-size:78px}.hero-pet.p3{font-size:62px}.wheel-area{height:360px}.wheel-wrap{width:315px;height:315px}.wheel-labels .wlabel{font-size:13px;width:96px}.wheel-pet{font-size:44px}.question{font-size:24px}.answer-row button{min-width:135px}.result-number{font-size:76px}.category-card{width:180px;height:180px}.category-icon{font-size:75px}}

  /* APP: contador de registros, respaldo y avisos */
  .count-badge{display:inline-flex;align-items:center;gap:8px;background:#e6f8ef;color:#13804f;border:1px solid #bfeccf;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:950;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
  .backup-row{margin-top:12px}
  .backup-row button{min-height:48px;padding:12px 20px;font-size:14px}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:16px 24px;border-radius:16px;font-size:15px;line-height:1.4;box-shadow:0 14px 40px rgba(22,51,88,.3);opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:min(560px,calc(100% - 32px));text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ===== ALMACENAMIENTO LOCAL =====
   Los registros se guardan en localStorage (igual que el prototipo) y además
   se copian a IndexedDB como segunda copia. Si una de las dos se pierde,
   se recupera desde la otra al abrir la app. Nada sale del dispositivo. */
const LEADS_KEY='wiservet_leads';
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('wiservet_db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(key,val){const db=await idbOpen();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);});}
async function idbGet(key){const db=await idbOpen();return new Promise((res,rej)=>{const r=db.transaction('kv','readonly').objectStore('kv').get(key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function loadLeads(){try{const v=JSON.parse(localStorage.getItem(LEADS_KEY)||'[]');return Array.isArray(v)?v:[]}catch(e){return []}}
function storeLeads(leads){
  try{localStorage.setItem(LEADS_KEY,JSON.stringify(leads));}catch(e){console.error(e);}
  try{idbSet(LEADS_KEY,leads).catch(e=>console.error(e));}catch(e){console.error(e);}
}
// Agrega a "base" los registros de "extra" que no existan (por id). Devuelve cuántos se agregaron.
function mergeLeads(base,extra){const ids=new Set(base.map(l=>String(l.id)));let added=0;for(const l of extra){if(l&&l.id!=null&&!ids.has(String(l.id))){base.push(l);ids.add(String(l.id));added++;}}return added;}
async function initStorage(){
  try{if(navigator.storage&&navigator.storage.persist)await navigator.storage.persist();}catch(e){}
  try{
    const leads=loadLeads();
    const mirror=await idbGet(LEADS_KEY);
    const added=Array.isArray(mirror)?mergeLeads(leads,mirror):0;
    storeLeads(leads);
    if(added&&state.screen==='records')showRecords();
  }catch(e){console.error(e);}
}

/* ===== ARCHIVOS (Excel / respaldo) ===== */
function fileStamp(){const d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`}
let toastTimer=null;
function toast(html,ms=5000){const t=document.getElementById('toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),ms);}
function saveFile(blob,filename){
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
  toast(`✅ Archivo guardado en <strong>Archivos → Descargas</strong><br>${filename}`,6000);
}
function downloadBackup(){
  const leads=loadLeads();
  const backup={app:'WISERVET Desafío Congreso',tipo:'respaldo',version:1,exportado:new Date().toISOString(),total:leads.length,registros:leads};
  saveFile(new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),`wiservet_backup_${fileStamp()}.json`);
}
function importBackup(){const input=document.getElementById('importFile');input.value='';input.click();}
function importBackupFile(input){
  const file=input.files&&input.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let incoming;
    try{const data=JSON.parse(reader.result);incoming=Array.isArray(data)?data:data.registros;}catch(e){}
    if(!Array.isArray(incoming)){alert('El archivo no es un respaldo válido de WISERVET (.json).');return;}
    if(!confirm(`El respaldo contiene ${incoming.length} registro(s).\nSe agregarán los que no existan en esta tablet (no se borra nada).\n\n¿Importar?`))return;
    const leads=loadLeads();const added=mergeLeads(leads,incoming);storeLeads(leads);
    showRecords();
    toast(`📥 Importados: <strong>${added}</strong> registro(s) nuevo(s)${incoming.length-added?` · ${incoming.length-added} ya existían`:''}`);
  };
  reader.readAsText(file);
}

function showRecords(){
  state.screen='records';
  const leads=loadLeads();
  const rows=leads.map((l,i)=>{
    const a=l.respuestas||[];
    const obs=a.map((x,n)=>x.note?`P${n+1}: ${x.note}`:'').filter(Boolean).join(' · ');
    const answerCells=Array.from({length:5},(_,n)=>{
      const ans=a[n]?.answer||'—';
      const cls=ans==='Sí'?'answer-yes':ans==='No'?'answer-no':'';
      return `<td class="${cls}" style="text-align:center;font-weight:800;min-width:70px">${ans}</td>`;
    }).join('');
    return `<tr><td>${i+1}</td><td>${l.nombre||''}</td><td>${l.clinica||''}</td><td>${l.whatsapp||''}</td><td>${l.categoria||''}</td><td>${l.porcentaje||''}</td><td>${l.reunion||'No'}</td>${answerCells}<td style="min-width:260px;max-width:360px">${obs||'—'}</td><td style="max-width:180px;word-break:break-all">${l.linkWhatsApp||''}</td></tr>`;
  }).join('');
  main.innerHTML=decorate(`<div class="screen" style="width:min(1200px,100%)"><h2>REGISTROS</h2><div class="count-badge" id="leadCount">🟢 ${leads.length} ${leads.length===1?'PARTICIPACIÓN GUARDADA':'PARTICIPACIONES GUARDADAS'}</div><p class="sub">Aquí puedes revisar todas las participaciones guardadas en este dispositivo. Las columnas P1–P5 muestran exactamente si respondió <strong>Sí</strong> o <strong>No</strong>, y las observaciones muestran las notas que registraste.</p><div style="overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:14px"><table style="width:100%;min-width:1250px;border-collapse:collapse;font-size:13px"><thead><tr><th>#</th><th>Nombre</th><th>Clínica</th><th>WhatsApp</th><th>Categoría</th><th>%</th><th>Reunión</th><th>P1</th><th>P2</th><th>P3</th><th>P4</th><th>P5</th><th>Notas / Observaciones</th><th>Link WhatsApp</th></tr></thead><tbody>${rows||'<tr><td colspan="14" style="padding:25px;text-align:center;color:#888">Todavía no hay registros.</td></tr>'}</tbody></table></div><div class="row" style="margin-top:20px"><button class="primary" onclick="downloadXLSX()">📊 DESCARGAR EXCEL</button><button class="primary" onclick="downloadBackup()">📦 RESPALDAR REGISTROS</button><button class="secondary" onclick="renderStart()">VOLVER</button></div><div class="row backup-row"><button class="secondary" onclick="importBackup()">📥 IMPORTAR RESPALDO</button></div><p class="small">Los archivos quedan en <strong>Archivos → Descargas</strong> de la tablet.</p></div>`);
}
function xmlEsc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function colName(n){let s='';while(n>0){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
function crc32(bytes){let table=crc32.table;if(!table){table=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0}crc32.table=table}let c=0xFFFFFFFF;for(const b of bytes)c=table[(c^b)&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function u16(n){return new Uint8Array([n&255,(n>>>8)&255])}
function u32(n){return new Uint8Array([n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255])}
function zipStore(files){
  const enc=new TextEncoder(), chunks=[], central=[]; let offset=0;
  const now=new Date(), dosTime=(now.getHours()<<11)|(now.getMinutes()<<5)|(now.getSeconds()/2), dosDate=((now.getFullYear()-1980)<<9)|((now.getMonth()+1)<<5)|now.getDate();
  for(const f of files){
    const name=enc.encode(f.name), data=typeof f.data==='string'?enc.encode(f.data):f.data, crc=crc32(data);
    const local=new Uint8Array(30+name.length+data.length);let o=0;
    local.set([80,75,3,4],o);o+=4;local.set(u16(20),o);o+=2;local.set(u16(0),o);o+=2;local.set(u16(0),o);o+=2;local.set(u16(dosTime),o);o+=2;local.set(u16(dosDate),o);o+=2;local.set(u32(crc),o);o+=4;local.set(u32(data.length),o);o+=4;local.set(u32(data.length),o);o+=4;local.set(u16(name.length),o);o+=2;local.set(u16(0),o);o+=2;local.set(name,o);o+=name.length;local.set(data,o);
    chunks.push(local);
    const c=new Uint8Array(46+name.length);o=0;c.set([80,75,1,2],o);o+=4;c.set(u16(20),o);o+=2;c.set(u16(20),o);o+=2;c.set(u16(0),o);o+=2;c.set(u16(0),o);o+=2;c.set(u16(dosTime),o);o+=2;c.set(u16(dosDate),o);o+=2;c.set(u32(crc),o);o+=4;c.set(u32(data.length),o);o+=4;c.set(u32(data.length),o);o+=4;c.set(u16(name.length),o);o+=2;c.set(u16(0),o);o+=2;c.set(u16(0),o);o+=2;c.set(u16(0),o);o+=2;c.set(u16(0),o);o+=2;c.set(u32(0),o);o+=4;c.set(u32(offset),o);o+=4;c.set(name,o);central.push(c);offset+=local.length;
  }
  const centralOffset=offset, centralSize=central.reduce((a,b)=>a+b.length,0), end=new Uint8Array(22);let o=0;end.set([80,75,5,6],o);o+=4;end.set(u16(0),o);o+=2;end.set(u16(0),o);o+=2;end.set(u16(files.length),o);o+=2;end.set(u16(files.length),o);o+=2;end.set(u32(centralSize),o);o+=4;end.set(u32(centralOffset),o);o+=4;end.set(u16(0),o);
  return new Blob([...chunks,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function downloadXLSX(){
  const leads=loadLeads();
  const headers=['Fecha','Nombre','Clínica','WhatsApp','Email','Categoría','Puntaje','Porcentaje','Reunión','Link WhatsApp','P1','P2','P3','P4','P5','Nota P1','Nota P2','Nota P3','Nota P4','Nota P5','Observaciones','Tiempo P1','Tiempo P2','Tiempo P3','Tiempo P4','Tiempo P5'];
  const rows=[headers,...leads.map(l=>{const a=l.respuestas||[];return [l.fecha,l.nombre,l.clinica,l.whatsapp,l.email,l.categoria,l.puntaje,l.porcentaje,l.reunion,l.linkWhatsApp||'',...Array.from({length:5},(_,i)=>a[i]?.answer||''),...Array.from({length:5},(_,i)=>a[i]?.note||''),a.map((x,i)=>x?.note?`P${i+1}: ${x.note}`:'').filter(Boolean).join(' | '),...Array.from({length:5},(_,i)=>a[i]?.timeRemaining??'')]})];
  const sheetRows=rows.map((row,r)=>`<row r="${r+1}">${row.map((v,c)=>{const ref=colName(c+1)+(r+1);const num=(typeof v==='number'||/^\d+(\.\d+)?$/.test(String(v))&&!String(v).includes('%'))?'1':'inlineStr';return num==='1'?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`}).join('')}</row>`).join('');
  const files=[
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Registros" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>`},
    {name:'xl/worksheets/sheet1.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${sheetRows}</sheetData></worksheet>`}
  ];
  saveFile(zipStore(files),`wiservet_registros_${fileStamp()}.xlsx`);
}
function buildWhatsAppLink(){
  const raw=String(state.person.phone||'').replace(/\D/g,''); let phone=raw;
  if(phone.startsWith('0'))phone=phone.slice(1);
  if(phone.length===9 && phone.startsWith('9'))phone='56'+phone;
  else if(phone.length===8)phone='569'+phone;
  const score=getScore(),pct=score*20,[title]=resultText(score);
  const dinosaur = score<=1 ? '🦖' : score===2 ? '🦖👀' : score===3 ? '🐾🧠' : score===4 ? '🧠🏆' : '🏆🐾';
  const msg=`Hola ${state.person.name} 👋\n\nHiciste el Desafío WISERVET en el Colchagua Business Veterinary 2026 🎯\n\n${dinosaur} Tu resultado: ${pct}%\n\n${title}\n\n📊 El desafío terminó… pero todavía hay datos de tu clínica que podemos descubrir juntos.\n\n¡AGENDEMOS UNA REUNIÓN! 🚀🐾`;
  return `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
}
function sendResultWhatsApp(){
  const link=buildWhatsAppLink();
  window.open(link,'_blank');

  saveLead(false);
}

  main.innerHTML = decorate(`<div class="screen">
    <div class="hero-badge">🐾 DESAFÍO WISERVET · EN VIVO</div>
    <div class="hero-visual"><div class="hero-pet p1">🐶</div><div class="hero-pet p2">🐱</div><div class="hero-pet p3">🩺</div><div class="spark s1">✦</div><div class="spark s2">✦</div><div class="spark s3">✦</div></div>
    <h1>¿CUÁNTO CONOCES<br>REALMENTE TU CLÍNICA?</h1>
    <p class="sub">Un desafío rápido, entretenido y con datos que quizás te sorprendan.</p>
    <div class="row"><button class="primary" onclick="showForm()">¡QUIERO JUGAR! 🎉</button><button class="secondary" onclick="showRecords()">VER REGISTROS</button></div>
  </div>`);
}
function showForm(){
  state.screen='form';
  main.innerHTML = decorate(`<div class="screen">
    <h2>Antes de comenzar</h2>
    <p class="sub">Registra tus datos para guardar tu resultado.</p>
    <div class="form">
      <input id="name" placeholder="Nombre *">
      <input id="clinic" placeholder="Clínica *">
      <input id="phone" placeholder="WhatsApp *">
      <input id="email" placeholder="Email">
    </div>
    <button class="primary" onclick="savePerson()">COMENZAR JUEGO →</button>
  </div>`);
}
function savePerson(){
  const name=document.getElementById('name').value.trim();
  const clinic=document.getElementById('clinic').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const email=document.getElementById('email').value.trim();
  if(!name||!clinic||!phone){alert('Completa Nombre, Clínica y WhatsApp.');return}
  state.person={name,clinic,phone,email};
  state.leadId=Date.now()+Math.floor(Math.random()*1000);
  state.resultSaved=false;
  showWheel();
}
function showWheel(){
  state.screen='wheel';
  main.innerHTML = decorate(`<div class="screen">
    <div class="hero-badge">🎯 MOMENTO DE LA VERDAD</div>
    <h2>¿QUÉ VAMOS A PONER<br>A PRUEBA?</h2>
    <p class="sub">Gira la ruleta. La suerte decide el tema… tú decides las respuestas.</p>
    <div class="wheel-area">
      <div class="wheel-pet wp1">🐾</div><div class="wheel-pet wp2">🐶</div><div class="wheel-pet wp3">🐱</div><div class="wheel-pet wp4">🩺</div>
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
          <svg class="wheel-svg" viewBox="0 0 360 360" aria-hidden="true">
            <!-- Ruleta perfectamente circular: 3 sectores de 120° -->
            <circle cx="180" cy="180" r="170" fill="#198fe9"/>
            <path d="M180 180 L327.2 95 A170 170 0 0 1 180 350 Z" fill="#ffd45c"/>
            <path d="M180 180 L180 350 A170 170 0 0 1 32.8 95 Z" fill="#42c98a"/>
            <!-- separadores limpios -->
            <path d="M180 180 L32.8 95" fill="none" stroke="#fff" stroke-width="4"/>
            <path d="M180 180 L327.2 95" fill="none" stroke="#fff" stroke-width="4"/>
            <path d="M180 180 L180 350" fill="none" stroke="#fff" stroke-width="4"/>
            <circle cx="180" cy="180" r="151" fill="none" stroke="rgba(255,255,255,.8)" stroke-width="2" stroke-dasharray="5 6"/>
            <circle cx="180" cy="180" r="170" fill="none" stroke="#fff" stroke-width="7"/>
            <!-- etiquetas centradas dentro de cada sector, cerca del círculo central y siempre legibles -->
            <g fill="#fff" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" text-anchor="middle" dominant-baseline="middle" style="paint-order:stroke;stroke:rgba(22,51,88,.42);stroke-width:3px;stroke-linejoin:round">
              <text x="180" y="82" transform="rotate(90 180 82)">CLÍNICA</text>
              <text x="272" y="232" transform="rotate(30 272 232)" textLength="105" lengthAdjust="spacingAndGlyphs">FINANCIERO</text>
              <text x="95" y="229" transform="rotate(-30 95 229)" textLength="92" lengthAdjust="spacingAndGlyphs">CLIENTES</text>
            </g>
          </svg>
          <div class="wheel-center" role="button" tabindex="0" aria-label="Girar la ruleta" onclick="spin()" onkeydown="if(event.key==='Enter'||event.key===' ')spin()"><span class="paw">🐾</span><span>GIRAR</span></div>
        </div>
      </div>
    </div>
    <div class="wheel-caption">✨ Toca <strong>GIRAR</strong> en el centro · 5 preguntas · 10 segundos cada una</div>
  </div>`);
}
function spin(){
  if(state.spinning)return;
  state.spinning=true;
  const keys=['Clínica','Financiero','Clientes'];
  // Aleatoriedad real en el navegador, evitando que la ruleta caiga siempre en la misma opción.
  const idx=(window.crypto&&crypto.getRandomValues)
    ? (crypto.getRandomValues(new Uint32Array(1))[0] % keys.length)
    : Math.floor(Math.random()*keys.length);
  state.category=keys[idx];
  const wheel=document.getElementById('wheel');
  // Centros de los segmentos: Clínica -90°, Financiero 30°, Clientes 150°.
  // La flecha apunta a -90°.
  const targetRotation=[0,240,120][idx];
  const current=((state.rotation%360)+360)%360;
  const extra=((targetRotation-current)%360+360)%360;
  state.rotation += 1800 + extra;
  wheel.style.transform=`rotate(${state.rotation}deg)`;
  const center=document.querySelector('.wheel-center');
  if(center){center.style.pointerEvents='none';center.style.opacity='.7';}
  setTimeout(()=>{
    state.spinning=false;
    showCategory();
  },6100);
}
function showCategory(){
  state.screen='category';
  const intro={
    "Clínica":"Veamos qué tan claros tienes los números y el funcionamiento de tu clínica.",
    "Financiero":"Veamos qué tan claros tienes los números de tu clínica.",
    "Clientes":"Veamos qué tan bien conoces a los clientes que hacen crecer tu clínica."
  }[state.category];
  const catClass=state.category==='Clínica'?'cat-clinica':state.category==='Financiero'?'cat-fin':'cat-clientes';
  const catIcon=state.category==='Clínica'?'🏥':state.category==='Financiero'?'💰':'🐾';
  main.innerHTML=decorate(`<div class="screen">
    <div class="category-card ${catClass}"><div class="category-icon">${catIcon}</div><div class="category-mini">ÁREA SELECCIONADA</div></div>
    <h2>${state.category.toUpperCase()}</h2>
    <p class="sub">${intro}<br><strong>5 preguntas · 10 segundos por pregunta.</strong></p>
    <button class="primary" onclick="startQuestions()">¡VAMOS! 🚀</button>
  </div>`);
}
let timer=null, timeLeft=10;
function startQuestions(){state.q=0;state.answers=[];showQuestion()}
function showQuestion(){
  state.screen='question';
  clearInterval(timer);timeLeft=10;
  const qs=categories[state.category], q=qs[state.q];
  main.innerHTML=decorate(`<div class="screen">
    <div class="progress"><div class="bar" style="width:${(state.q/5)*100}%"></div></div>
    <div class="qtop"><div class="qnum">PREGUNTA ${state.q+1} DE 5</div><div class="timer" id="timer">10</div></div>
    <div class="question">${q}</div>
    <div class="answer-row">
      <button class="yes" onclick="answer('Sí')">SÍ</button>
      <button class="no" onclick="answer('No')">NO</button>
    </div>
    <div class="note">
      <label class="small">Nota opcional (solo si quieres registrar algo que dijo el participante)</label>
      <textarea id="note" placeholder="Ej.: 'Lo sabe aproximadamente', 'lo revisa con contador'..."></textarea>
    </div>
    <p class="small">El cronómetro solo mide el tiempo. Tú registras la respuesta manualmente.</p>
  </div>`);
  timer=setInterval(()=>{
    timeLeft--;
    const el=document.getElementById('timer');
    if(el)el.textContent=timeLeft;
    if(timeLeft<=0){clearInterval(timer)}
  },1000);
}
function answer(value){
  clearInterval(timer);
  const note=document.getElementById('note')?.value.trim()||'';
  state.answers.push({question:categories[state.category][state.q],answer:value,note,timeRemaining:timeLeft});
  if(state.q<4){state.q++;showQuestion()}else{showResult()}
}
function getScore(){return state.answers.filter(x=>x.answer==='Sí').length}
function resultText(score){
  const data=[
    ['🦖 ¡ERES UN DINOSAURIO TODAVÍA!','Hay varias cosas de tu clínica que todavía tienes por descubrir.'],
    ['🦖 DINOSAURIO EN EVOLUCIÓN','Ya sabes algunas cosas, pero todavía te falta descubrir bastante sobre tu clínica.'],
    ['👀 ¡TE FALTA INFORMACIÓN!','Ya conoces algunas cosas, pero todavía hay datos importantes que deberías estar mirando.'],
    ['🔎 ¡VAS BIEN, PERO FALTA HARTO!','Conoces una buena parte, pero todavía hay varios datos importantes que no estás viendo.'],
    ['🧠 ¡BIEN!','Sabes mucho, pero no lo sabes todo 😏. Todavía hay datos que podrían sorprenderte.'],
    ['🏆 ¡MUY BUEN TRABAJO!','Conoces muy bien tu clínica. Pero incluso así, podemos mostrarte datos que quizás todavía no estás usando para llevarla más lejos.']
  ];
  return data[score];
}
function showResult(){
  state.screen='result';
  if(!state.resultSaved){saveLead(false);state.resultSaved=true;}
  const score=getScore(), pct=score*20, [title,copy]=resultText(score);
  const fun=[
    '🦖 MODO DINOSAURIO · ¡Hay mucho por descubrir!',
    '🦖 DINOSAURIO EN EVOLUCIÓN · Todavía hay bastante por descubrir.',
    '👀 TE FALTA INFORMACIÓN · Hay datos importantes por mirar.',
    '🔎 VAS BIEN, PERO FALTA HARTO · Todavía quedan datos por descubrir.',
    '🧠 ¡BIEN! · Sabes mucho, pero no lo sabes todo.',
    '🏆 ¡MUY BUEN TRABAJO! · Aun así, podemos sorprenderte.'
  ][score];
  main.innerHTML=decorate(`<div class="screen">
    <img class="result-logo" src="${transparentLogoSrc}" alt="WISERVET">
    <div class="qnum">TU RESULTADO</div>
    <div class="result-number">${pct}%</div>
    <div class="result-fun">${fun}</div>
    <div class="result-title">${title}</div>
    <p class="result-copy">${copy}</p>
    <p class="small"><strong>Área evaluada:</strong> ${state.category}</p>
    <div class="row"><button class="whatsapp-result" onclick="sendResultWhatsApp()">📲 ENVIARME MI RESULTADO</button><button class="secondary" onclick="showQuestionReview()">VER RESPUESTAS</button><button class="primary" onclick="showMeeting()">CONTINUAR →</button></div>
    <p class="small" style="margin-top:14px">Se abrirá WhatsApp con tu resultado listo para enviar.</p>
  </div>`);
}

function showQuestionReview(){state.screen='review';const rows=state.answers.map((a,i)=>`<div class="answer-row-summary"><strong>${i+1}</strong><span>${a.question}${a.note?`<br><small class="small">Nota: ${a.note}</small>`:''}</span><span class="${a.answer==='Sí'?'answer-yes':'answer-no'}">${a.answer}</span></div>`).join('');main.innerHTML=decorate(`<div class="screen"><h2>TUS RESPUESTAS</h2><p class="sub">Revisa lo que registraste durante el juego.</p><div class="answer-summary">${rows}</div><button class="primary" onclick="showResult()">VOLVER AL RESULTADO</button></div>`);}
function showMeeting(){
  state.screen='meeting';
  saveLead(false);
  main.innerHTML=decorate(`<div class="screen">
    <div class="meeting">
      <img class="meeting-logo" src="${transparentLogoSrc}" alt="WISERVET">
      <h2>¿AGENDAMOS UNA REUNIÓN?</h2>
      <p><strong>Te mostraremos los datos que hoy no estás viendo de tu clínica.</strong></p>
      <p>En una breve reunión podremos revisar cómo conocerlos y tomar decisiones con información real.</p>
      <button class="primary" onclick="meetingDone()">📅 AGENDAR REUNIÓN</button>
    </div>
  </div>`);
}
function meetingDone(){
  state.screen='done';
  saveLead(true);
  main.innerHTML=decorate(`<div class="screen">
    <div class="choco">🍫</div>
    <h2>¡TE GANASTE UN CHOCOLATITO!</h2>
    <p class="sub">¡Gracias por participar en el desafío WISERVET!</p>
    <p><strong>Tu resultado y tus datos quedaron registrados.</strong></p>
    <button class="secondary" onclick="renderStart()">NUEVO PARTICIPANTE</button>
    <div class="saved">Registro guardado en este dispositivo.</div>
  </div>`);
}
function saveLead(meeting){
  const score=getScore();
  const lead={
    id:state.leadId,
    fecha:new Date().toLocaleString('es-CL'),
    nombre:state.person.name,clinica:state.person.clinic,whatsapp:state.person.phone,email:state.person.email,
    categoria:state.category,puntaje:`${score}/5`,porcentaje:`${score*20}%`,
    reunion:meeting?'Sí':'No',
    linkWhatsApp:buildWhatsAppLink(),
    respuestas:state.answers
  };
  const leads=loadLeads();
  // Update the current lead if it already exists, otherwise append.
  const idx=leads.findIndex(x=>x.id===lead.id);
  if(idx>=0)leads[idx]=lead; else leads.push(lead);
  storeLeads(leads);
}
renderStart();
initStorage();

/* ===== MODO OFFLINE: registra el service worker que guarda la app en la tablet ===== */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(e=>console.error(e)));
}
</script>
